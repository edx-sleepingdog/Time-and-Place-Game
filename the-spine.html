<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spine — a chronological journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #efe7d6;
    --paper-deep: #e6dcc6;
    --ink: #26313c;
    --ink-soft: #4b5763;
    --brass: #a9782f;
    --brass-soft: #cba86a;
    --travel: #a73b2b;
    --travel-soft: rgba(167,59,43,0.35);
    --dim: #9c9284;
    --line: rgba(38,49,60,0.16);
    --card-bg: #f7f2e6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.05), transparent 60%);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
    padding: clamp(16px, 3vw, 40px);
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-end; gap: 24px;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 22px; flex-wrap: wrap;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--brass); margin:0 0 4px;
  }
  h1{
    font-family:'Spectral', serif; font-weight:700; font-size: clamp(30px,4.4vw,46px);
    margin:0; letter-spacing:-0.01em;
  }
  h1 em{ font-style:italic; color:var(--travel); font-weight:600; }
  .tagline{ font-size:14px; color:var(--ink-soft); margin-top:6px; max-width:46ch; }
  .stats{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);
    text-align:right; line-height:1.7;
  }
  .stats b{ color:var(--ink); font-weight:600; }
  .stats .due{ color:var(--travel); font-weight:600; }

  .layout{
    display:grid; grid-template-columns: 1.55fr 1fr; gap: 22px;
  }
  @media (max-width: 880px){ .layout{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--card-bg);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 24px -18px rgba(38,49,60,0.5);
    border-radius: 3px;
  }

  /* --- Map --- */
  .map-panel{ padding: 14px 14px 10px; position:relative; }
  .map-frame{
    position:relative; width:100%; border:1px solid var(--line); border-radius:2px;
    overflow:hidden; background:#e2d8c1;
  }
  .map-frame svg{ display:block; width:100%; height:auto; }
  .map-caption{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft);
    padding: 8px 4px 2px; letter-spacing:.04em;
  }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  .pin-label{
    font-family:'IBM Plex Mono', monospace; font-size: 8.5px; fill: var(--ink-soft);
    pointer-events:none;
  }

  /* --- Card panel --- */
  .card-panel{ padding: 20px 22px 22px; display:flex; flex-direction:column; min-height: 420px; }
  .card-kicker{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color: var(--travel); margin-bottom:8px; font-weight:600;
  }
  .card-kicker.new{ color: var(--brass); }
  .card-kicker.done{ color: var(--ink-soft); }
  .wp-year{ font-family:'Spectral', serif; font-weight:700; font-size: 30px; line-height:1.05; }
  .wp-place{ font-size:15px; color:var(--ink-soft); margin-top:2px; margin-bottom:14px; font-style:italic; }

  .wp-image-wrap{
    width:100%; aspect-ratio: 4/3; overflow:hidden; border:1px solid var(--line);
    background:#ddd3ba; margin-bottom:14px; border-radius:2px;
  }
  .wp-image-wrap img{ width:100%; height:100%; object-fit:cover; display:block; filter: sepia(8%) saturate(92%); }

  .wp-fact{ font-size:15.5px; line-height:1.55; color:var(--ink); margin-bottom:6px; }
  .wp-source{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--dim); margin-top:auto; padding-top:10px; }

  .btn-row{ display:flex; gap:10px; margin-top:16px; }
  button{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.03em;
    padding: 11px 16px; border-radius:2px; cursor:pointer; border:1px solid var(--ink);
    background: var(--ink); color: var(--paper); transition: transform .12s ease, opacity .12s ease;
    text-transform: uppercase;
  }
  button.secondary{ background:transparent; color:var(--ink); }
  button.forgot{ background: transparent; color: var(--travel); border-color: var(--travel); }
  button:hover{ transform: translateY(-1px); }
  button:active{ transform: translateY(0); opacity:.85; }
  button:disabled{ opacity:.4; cursor:default; transform:none; }

  .prompt-box{
    border: 1.5px dashed var(--brass-soft); border-radius:2px; padding:18px;
    text-align:center; margin: 10px 0 18px; background: rgba(169,120,47,0.06);
  }
  .prompt-box .hint{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .prompt-box .q{ font-size:15px; color:var(--ink-soft); }

  .done-state{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; flex:1; }
  .done-state .big{ font-family:'Spectral', serif; font-size:22px; margin-bottom:8px; }

  footer{
    margin-top: 22px; display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--dim); flex-wrap:wrap; gap:8px;
  }
  footer a{ color: var(--ink-soft); cursor:pointer; text-decoration: underline; }

  .marker-glyph{ filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="brand-eyebrow">Learning a date = visiting its place</p>
      <h1>The <em>Spine</em></h1>
      <p class="tagline">Eighty-three anchor dates, one route. Forget one and the line only fades — it never erases. History didn't move; your memory did.</p>
    </div>
    <div class="stats" id="statsBox"></div>
  </header>

  <div class="layout">
    <div class="panel map-panel">
      <div class="map-frame">
        <svg id="mapSvg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
          <image href="https://commons.wikimedia.org/wiki/Special:FilePath/Equirectangular_projection_SW.jpg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none" opacity="0.88"/>
          <g id="routeLayer"></g>
          <g id="pinLayer"></g>
          <g id="markerLayer"></g>
        </svg>
      </div>
      <div class="map-caption">
        <div class="legend">
          <span><i style="background:var(--travel)"></i>visited</span>
          <span><i style="background:var(--dim);opacity:.5"></i>forgotten</span>
          <span><i style="background:var(--ink-soft);opacity:.25"></i>ahead</span>
        </div>
        <div id="posLabel">MARKER — —</div>
      </div>
    </div>

    <div class="panel card-panel" id="cardPanel"></div>
  </div>

  <footer>
    <span>Route: 11 of 83 anchor dates · MVP proof of the core loop</span>
    <a id="resetLink">reset journey</a>
  </footer>

</div>

<script>
/* ---------------------------------------------------------
   DATA — 11 real, sourced anchor dates. No invented facts.
--------------------------------------------------------- */
const WAYPOINTS = [
  {
    id:'narmer', order:0, year:-3100, yearLabel:'c. 3100 BCE', place:'Memphis, Egypt',
    lat:29.84, lon:31.25,
    fact:"The Narmer Palette shows King Narmer wearing the crowns of both Upper and Lower Egypt in a single scene — the earliest surviving record of Egypt unified under one ruler.",
    source:'Egyptian Museum, Cairo · Narmer Palette',
    img:'Narmer_Palette.jpg'
  },
  {
    id:'giza', order:1, year:-2560, yearLabel:'c. 2560 BCE', place:'Giza, Egypt',
    lat:29.9792, lon:31.1342,
    fact:"Built as a tomb for Pharaoh Khufu, the Great Pyramid held the record as the tallest human-made structure on Earth for almost 3,800 years, until Lincoln Cathedral's spire surpassed it.",
    source:'Giza Plateau necropolis',
    img:'Great_Pyramid_of_Giza.jpg'
  },
  {
    id:'parthenon', order:2, year:-447, yearLabel:'447–432 BCE', place:'Athens, Greece',
    lat:37.9715, lon:23.7267,
    fact:"The Parthenon was built after the Persian Wars, funded in part by tribute from the Delian League. Its columns lean almost imperceptibly inward — a correction for an optical illusion that would otherwise make a perfectly straight temple look like it's bowing outward.",
    source:'Acropolis of Athens',
    img:'Ancient_temple_Parthenon_in_Acropolis_Athens.jpg'
  },
  {
    id:'qin', order:3, year:-221, yearLabel:'221 BCE', place:'Xianyang, China',
    lat:34.266, lon:108.939,
    fact:"Qin Shi Huang conquered the last of the rival Warring States and unified China under one crown, standardizing weights, currency, and script. He ordered thousands of individually detailed terracotta soldiers buried near his tomb to guard him in the afterlife.",
    source:'Terracotta Army, Pit 1, near Xi\u2019an',
    img:'Qin_Shihuang_Terracotta_Army,_Pit_1.jpg'
  },
  {
    id:'caesar', order:4, year:-44, yearLabel:'44 BCE', place:'Rome, Italy',
    lat:41.9028, lon:12.4964,
    fact:"Julius Caesar was stabbed 23 times by a group of senators, including Brutus and Cassius, at a meeting of the Senate held inside the Theatre of Pompey — not the Senate House itself, which was being rebuilt.",
    source:'Curia of Pompey, Rome',
    img:'Vincenzo_Camuccini_-_La_morte_di_Cesare.jpg'
  },
  {
    id:'magnacarta', order:5, year:1215, yearLabel:'1215 CE', place:'Runnymede, England',
    lat:51.4436, lon:-0.5610,
    fact:"Facing a revolt by his barons, King John affixed his seal to Magna Carta at Runnymede. It was the first time an English king agreed, in writing, that he was not above the law.",
    source:'Magna Carta, British Library Cotton MS Augustus II.106',

  },
  {
    id:'blackdeath', order:6, year:1347, yearLabel:'1347 CE', place:'Messina, Sicily',
    lat:38.1938, lon:15.5540,
    fact:"Genoese trading galleys carrying plague-stricken sailors docked at Messina in October 1347. Within a few years the Black Death had killed an estimated one third to one half of Europe's population.",
    source:"Nuremberg Chronicle, 1493 — Dance of Death woodcut",
    img:'Nuremberg_chronicles_-_Dance_of_Death_(CCLXIIIIv).jpg'
  },
  {
    id:'constantinople', order:7, year:1453, yearLabel:'1453 CE', place:'Constantinople',
    lat:41.0082, lon:28.9784,
    fact:"After a 53-day siege, Ottoman forces under Sultan Mehmed II breached the ancient land walls using enormous bronze cannons, ending the thousand-year Byzantine Empire.",
    source:'Nuremberg Chronicle, 1493 — view of Constantinople',
    img:'Nuremberg_chronicles_-_CONSTANTINOPEL.png'
  },
  {
    id:'columbus', order:8, year:1492, yearLabel:'1492 CE', place:'San Salvador, Bahamas',
    lat:24.0333, lon:-74.5333,
    fact:"After 36 days out of sight of land, Columbus's expedition made landfall on an island he named San Salvador, convinced he had reached the outer islands of Asia.",
    source:'John Vanderlyn, Landing of Columbus, US Capitol Rotunda',
    img:'Landing_of_Columbus_(2).jpg'
  },
  {
    id:'bastille', order:9, year:1789, yearLabel:'1789 CE', place:'Paris, France',
    lat:48.8531, lon:2.3691,
    fact:"A Parisian crowd stormed the royal fortress of the Bastille to seize gunpowder, freeing the seven prisoners held inside. The date is now France's national holiday.",
    source:'Jean-Pierre Houël, 1789 — contemporary painting',
    img:'Prise_de_la_Bastille_clean.jpg'
  },
  {
    id:'apollo11', order:10, year:1969, yearLabel:'1969 CE', place:'Kennedy Space Center, USA',
    lat:28.5721, lon:-80.6480,
    fact:"Five days after launching from Kennedy Space Center, Neil Armstrong and Buzz Aldrin walked on the Moon on July 20, 1969, while Michael Collins orbited alone in the command module above.",
    source:'NASA — Aldrin on the Moon, photographed by Armstrong',
    img:'Aldrin_Apollo_11_original.jpg'
  }
];

const IMG_BASE = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
const MAP_W = 1000, MAP_H = 500;
function project(lat, lon){
  return { x: (lon + 180) / 360 * MAP_W, y: (90 - lat) / 180 * MAP_H };
}

// Some anchor dates share near-identical real-world coordinates (e.g. Memphis
// and Giza are ~20km apart — invisible at world-map scale). This spreads pins
// that would otherwise stack, using a deterministic minimum-separation pass
// so the layout is stable across reloads and never drifts far from the true
// geographic point.
function computeLayout(){
  const raw = {}, pos = {};
  WAYPOINTS.forEach(w=>{ const p = project(w.lat, w.lon); raw[w.id]=p; pos[w.id]={x:p.x,y:p.y}; });
  const ids = WAYPOINTS.map(w=>w.id);
  const MIN_SEP = 20, MAX_DRIFT = 32;
  for(let iter=0; iter<80; iter++){
    let moved = false;
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        const a = pos[ids[i]], b = pos[ids[j]];
        let dx = b.x-a.x, dy = b.y-a.y;
        let dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 0.01){
          const ang = i*2.399963;
          dx = Math.cos(ang); dy = Math.sin(ang); dist = 1;
        }
        if(dist < MIN_SEP){
          moved = true;
          const push = (MIN_SEP-dist)/2;
          const ux = dx/dist, uy = dy/dist;
          const na = {x:a.x-ux*push, y:a.y-uy*push};
          const nb = {x:b.x+ux*push, y:b.y+uy*push};
          const d2 = (p,q)=> (p.x-q.x)*(p.x-q.x) + (p.y-q.y)*(p.y-q.y);
          if(d2(na, raw[ids[i]]) < MAX_DRIFT*MAX_DRIFT) pos[ids[i]] = na;
          if(d2(nb, raw[ids[j]]) < MAX_DRIFT*MAX_DRIFT) pos[ids[j]] = nb;
        }
      }
    }
    if(!moved) break;
  }
  return { raw, pos };
}
let LAYOUT = null;
function pinPos(w){ return LAYOUT.pos[w.id]; }

/* ---------------------------------------------------------
   SPACED REPETITION — simple "wrong comes back sooner" logic
--------------------------------------------------------- */
const BOX_INTERVALS_MS = [
  2 * 60 * 1000,          // box 0 -> 1 : 2 min   (so the loop is visible today)
  24 * 60 * 60 * 1000,    // box 1 -> 2 : 1 day
  3 * 24 * 60 * 60 * 1000,// box 2 -> 3 : 3 days
  7 * 24 * 60 * 60 * 1000,// box 3 -> 4 : 7 days
  21 * 24 * 60 * 60 * 1000// box 4 -> 5 : 21 days
];
const FORGOTTEN_RETRY_MS = 60 * 1000; // comes back sooner after a miss

const STORE_KEY = 'the_spine_progress_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const progress = {};
  WAYPOINTS.forEach((w,i)=>{
    progress[w.id] = { status: i===0 ? 'new' : 'locked', box:0, strength:1, dueAt:null };
  });
  return { progress, furthest: null };
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();

function orderedLearned(){
  return WAYPOINTS.filter(w => state.progress[w.id].status === 'learned')
                   .sort((a,b)=>a.order-b.order);
}
function nextLockedInSequence(){
  const sorted = [...WAYPOINTS].sort((a,b)=>a.order-b.order);
  for(const w of sorted){
    const st = state.progress[w.id];
    if(st.status === 'locked' || st.status === 'new') return w;
  }
  return null;
}
function overdueList(){
  const now = Date.now();
  return orderedLearned()
    .filter(w => state.progress[w.id].dueAt !== null && state.progress[w.id].dueAt <= now)
    .sort((a,b)=> state.progress[a.id].dueAt - state.progress[b.id].dueAt);
}
function nextAction(){
  const overdue = overdueList();
  if(overdue.length) return { type:'review', wp: overdue[0] };
  const nextNew = nextLockedInSequence();
  if(nextNew) return { type:'learn', wp: nextNew };
  const learned = orderedLearned();
  const soonest = learned
    .map(w=>state.progress[w.id].dueAt)
    .filter(d=>d!==null)
    .sort((a,b)=>a-b)[0];
  return { type:'done', nextDue: soonest || null };
}
function furthestWaypoint(){
  const learned = orderedLearned();
  if(!learned.length) return null;
  return learned[learned.length-1];
}

/* ---------------------------------------------------------
   RENDER — map, pins, route, marker
--------------------------------------------------------- */
const svg = document.getElementById('mapSvg');
const routeLayer = document.getElementById('routeLayer');
const pinLayer = document.getElementById('pinLayer');
const markerLayer = document.getElementById('markerLayer');
let markerPos = null; // {x,y}
let animating = false;

function ns(tag){ return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function renderMap(){
  routeLayer.innerHTML = '';
  pinLayer.innerHTML = '';

  const learned = orderedLearned();

  // route line through learned waypoints, thinner/fainter into forgotten ones
  for(let i=1;i<learned.length;i++){
    const a = pinPos(learned[i-1]);
    const b = pinPos(learned[i]);
    const st = state.progress[learned[i].id];
    const strength = st.strength;
    const line = ns('line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke', strength < 0.6 ? 'var(--dim)' : 'var(--travel)');
    line.setAttribute('stroke-width', 0.6 + strength*1.6);
    line.setAttribute('stroke-opacity', 0.25 + strength*0.55);
    line.setAttribute('stroke-linecap','round');
    line.setAttribute('stroke-dasharray', strength < 0.6 ? '3,4' : 'none');
    routeLayer.appendChild(line);
  }

  // pins
  WAYPOINTS.forEach(w=>{
    const st = state.progress[w.id];
    const p = pinPos(w);
    const g = ns('g');
    const c = ns('circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);

    if(st.status === 'learned'){
      const strength = st.strength;
      c.setAttribute('r', 5.5);
      c.setAttribute('fill', strength < 0.6 ? 'var(--dim)' : 'var(--travel)');
      c.setAttribute('fill-opacity', 0.35 + strength*0.6);
      c.setAttribute('stroke', '#3a2a20');
      c.setAttribute('stroke-width', 0.6);
    } else if(st.status === 'new'){
      c.setAttribute('r', 5);
      c.setAttribute('fill', 'var(--brass)');
      c.setAttribute('fill-opacity', 0.9);
      const pulse = ns('circle');
      pulse.setAttribute('cx', p.x); pulse.setAttribute('cy', p.y);
      pulse.setAttribute('r', 9); pulse.setAttribute('fill','none');
      pulse.setAttribute('stroke','var(--brass)'); pulse.setAttribute('stroke-width','1');
      pulse.setAttribute('stroke-opacity','0.6');
      g.appendChild(pulse);
    } else {
      c.setAttribute('r', 3);
      c.setAttribute('fill', 'var(--ink-soft)');
      c.setAttribute('fill-opacity', 0.22);
    }
    g.appendChild(c);

    if(st.status !== 'locked'){
      const label = ns('text');
      label.setAttribute('x', p.x + 7);
      label.setAttribute('y', p.y - 6);
      label.setAttribute('class','pin-label');
      label.textContent = w.yearLabel.replace(' CE','').replace(' BCE',' BC');
      g.appendChild(label);
    }
    pinLayer.appendChild(g);
  });

  renderMarker();
}

function markerGlyph(x,y){
  markerLayer.innerHTML = '';
  if(!x && x!==0) return;
  const g = ns('g');
  g.setAttribute('class','marker-glyph');
  g.setAttribute('transform', `translate(${x},${y})`);
  const ring = ns('circle');
  ring.setAttribute('r', 10); ring.setAttribute('fill','none');
  ring.setAttribute('stroke','var(--travel)'); ring.setAttribute('stroke-width','1.2');
  ring.setAttribute('stroke-opacity','0.55');
  const dot = ns('circle');
  dot.setAttribute('r', 4.5); dot.setAttribute('fill','var(--travel)');
  dot.setAttribute('stroke','#3a1712'); dot.setAttribute('stroke-width','0.8');
  g.appendChild(ring); g.appendChild(dot);
  markerLayer.appendChild(g);
}
function renderMarker(){
  if(markerPos){ markerGlyph(markerPos.x, markerPos.y); }
  else { markerLayer.innerHTML = ''; }
  const posLabel = document.getElementById('posLabel');
  const f = furthestWaypoint();
  posLabel.textContent = f ? `MARKER — ${f.place.toUpperCase()}, ${f.yearLabel}` : 'MARKER — UNPLACED';
}

// Arc animation: never a jump-cut. Interpolates along a raised quadratic curve.
function arcTravel(from, to, duration, onDone){
  animating = true;
  const start = performance.now();
  const dx = to.x-from.x, dy = to.y-from.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const mx = (from.x+to.x)/2, my = (from.y+to.y)/2;
  const nx = -dy/(dist||1), ny = dx/(dist||1);
  const lift = Math.min(70, dist*0.35);
  const cx = mx + nx*lift, cy = my + ny*lift - 6;

  function frame(now){
    let t = Math.min(1, (now-start)/duration);
    const ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOutQuad
    const x = (1-ease)*(1-ease)*from.x + 2*(1-ease)*ease*cx + ease*ease*to.x;
    const y = (1-ease)*(1-ease)*from.y + 2*(1-ease)*ease*cy + ease*ease*to.y;
    markerPos = {x,y};
    markerGlyph(x,y);
    if(t<1){ requestAnimationFrame(frame); }
    else{ animating=false; if(onDone) onDone(); }
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------
   CARD UI
--------------------------------------------------------- */
const cardPanel = document.getElementById('cardPanel');

function fmtCountdown(ms){
  if(ms<=0) return 'due now';
  const mins = Math.round(ms/60000);
  if(mins < 60) return `in ${mins} min`;
  const hrs = Math.round(mins/60);
  if(hrs < 48) return `in ${hrs} hr`;
  const days = Math.round(hrs/24);
  return `in ${days} day${days===1?'':'s'}`;
}

function renderCard(){
  const action = nextAction();

  if(action.type === 'learn'){
    const w = action.wp;
    cardPanel.innerHTML = `
      <p class="card-kicker new">Next waypoint · unlocked</p>
      <div class="wp-year">${w.yearLabel}</div>
      <div class="wp-place">${w.place}</div>
      <div class="wp-image-wrap"><img src="${IMG_BASE}${w.img}" alt="${w.place}"></div>
      <p class="wp-fact">${w.fact}</p>
      <p class="wp-source">Source — ${w.source}</p>
      <div class="btn-row"><button id="learnBtn">Mark visited</button></div>
    `;
    document.getElementById('learnBtn').onclick = ()=>{
      if(animating) return;
      const from = markerPos || pinPos(w);
      const to = pinPos(w);
      state.progress[w.id].status = 'learned';
      state.progress[w.id].box = 0;
      state.progress[w.id].strength = 1;
      state.progress[w.id].dueAt = Date.now() + BOX_INTERVALS_MS[0];
      const nn = nextLockedInSequence();
      if(nn) state.progress[nn.id].status = 'locked'; // stays locked until this unlocks it below
      saveState();
      renderMap();
      arcTravel(from, to, 900, ()=>{
        // unlock the following waypoint as 'new' if nothing overdue
        maybeUnlockNext();
        saveState(); renderMap(); renderStats(); renderCard();
      });
    };
  }
  else if(action.type === 'review'){
    const w = action.wp;
    const revealed = cardPanel.dataset.revealedFor === w.id;
    if(!revealed){
      cardPanel.innerHTML = `
        <p class="card-kicker">Overdue review</p>
        <div class="wp-year">${w.yearLabel}</div>
        <div class="wp-place">${w.place}</div>
        <div class="prompt-box">
          <div class="hint">Recall before revealing</div>
          <div class="q">What happened here, and why does it matter to what came after?</div>
        </div>
        <div class="btn-row"><button id="revealBtn" class="secondary">Reveal</button></div>
      `;
      const to = pinPos(w);
      if(!animating) arcTravel(markerPos || to, to, 700);
      document.getElementById('revealBtn').onclick = ()=>{
        cardPanel.dataset.revealedFor = w.id;
        renderCard();
      };
    } else {
      cardPanel.innerHTML = `
        <p class="card-kicker">Overdue review</p>
        <div class="wp-year">${w.yearLabel}</div>
        <div class="wp-place">${w.place}</div>
        <div class="wp-image-wrap"><img src="${IMG_BASE}${w.img}" alt="${w.place}"></div>
        <p class="wp-fact">${w.fact}</p>
        <p class="wp-source">Source — ${w.source}</p>
        <div class="btn-row">
          <button id="gotBtn">Remembered</button>
          <button id="forgotBtn" class="forgot">Forgot</button>
        </div>
      `;
      document.getElementById('gotBtn').onclick = ()=> answerReview(w, true);
      document.getElementById('forgotBtn').onclick = ()=> answerReview(w, false);
    }
  }
  else {
    const countdown = action.nextDue ? fmtCountdown(action.nextDue - Date.now()) : null;
    cardPanel.innerHTML = `
      <div class="done-state">
        <p class="card-kicker done">Caught up</p>
        <div class="big">The route is quiet for now.</div>
        <p class="wp-fact">${countdown ? `Next review comes due ${countdown}.` : 'No dates on the route yet — begin below.'} ${orderedLearned().length < WAYPOINTS.length ? '' : 'All eleven MVP dates are on the route.'}</p>
      </div>
    `;
  }
}

function maybeUnlockNext(){
  if(overdueList().length) return; // gated: overdue reviews must clear first
  const nn = nextLockedInSequence();
  if(nn) state.progress[nn.id].status = 'new';
}

function answerReview(w, remembered){
  if(animating) return;
  const st = state.progress[w.id];
  if(remembered){
    st.box = Math.min(BOX_INTERVALS_MS.length-1, st.box+1);
    st.strength = Math.min(1, st.strength + 0.25);
    st.dueAt = Date.now() + BOX_INTERVALS_MS[st.box];
  } else {
    st.box = Math.max(0, st.box-1);
    st.strength = Math.max(0.15, st.strength - 0.3); // dims the pin / thins the line
    st.dueAt = Date.now() + FORGOTTEN_RETRY_MS;
  }
  cardPanel.dataset.revealedFor = '';
  saveState();
  renderMap();

  const f = furthestWaypoint();
  const backTo = f ? pinPos(f) : pinPos(w);
  const from = pinPos(w);
  arcTravel(from, backTo, 900, ()=>{
    maybeUnlockNext();
    saveState(); renderMap(); renderStats(); renderCard();
  });
}

function renderStats(){
  const learnedCount = orderedLearned().length;
  const due = overdueList().length;
  const forgotten = orderedLearned().filter(w=>state.progress[w.id].strength < 0.6).length;
  document.getElementById('statsBox').innerHTML =
    `<b>${learnedCount}</b> / ${WAYPOINTS.length} dates on the route<br>` +
    (due ? `<span class="due">${due} due for review</span>` : `<span>0 due for review</span>`) +
    (forgotten ? ` · ${forgotten} faded` : '');
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
function init(){
  LAYOUT = computeLayout();
  const f = furthestWaypoint();
  markerPos = f ? pinPos(f) : null;
  renderMap();
  renderStats();
  renderCard();
}
document.getElementById('resetLink').onclick = ()=>{
  if(confirm('Reset the whole journey? This clears all progress on this device.')){
    localStorage.removeItem(STORE_KEY);
    state = loadState();
    cardPanel.dataset.revealedFor = '';
    init();
  }
};
init();
</script>
</body>
</html>
